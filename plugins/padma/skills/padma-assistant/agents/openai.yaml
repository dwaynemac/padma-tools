interface:
  display_name: "PADMA Assistant"
  short_description: "Coordinar CRM, Money y contexto de contactos"
  default_prompt: "Usá $padma-assistant para relacionar un contacto de CRM con su contexto en Money sin mezclar organizaciones ni fuentes."

dependencies:
  tools:
    - type: "mcp"
      value: "crm"
      description: "Servidor MCP remoto de PADMA CRM"
      transport: "streamable_http"
      url: "https://crm.derose.app/mcp"
    - type: "mcp"
      value: "money"
      description: "Servidor MCP remoto de PADMA Money"
      transport: "streamable_http"
      url: "https://money.derose.app/mcp"
