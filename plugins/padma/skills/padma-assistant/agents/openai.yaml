interface:
  display_name: "PADMA Assistant"
  short_description: "Coordinar CRM, Money y análisis comerciales"
  default_prompt: "Usá $padma-assistant para elegir el funnel de CRM adecuado y relacionar métricas históricas con Money sin mezclar fuentes."

dependencies:
  tools:
    - type: "mcp"
      value: "crm"
      description: "Servidor MCP remoto de PADMA CRM"
      transport: "streamable_http"
      url: "https://crm.derose.app/mcp"
    - type: "mcp"
      value: "money"
      description: "Servidor MCP remoto de PADMA Money"
      transport: "streamable_http"
      url: "https://money.derose.app/mcp"
