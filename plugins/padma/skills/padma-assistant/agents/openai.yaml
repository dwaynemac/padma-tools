interface:
  display_name: "PADMA Assistant"
  short_description: "Coordinar CRM, Money y deuda de pagos"
  default_prompt: "Usá $padma-assistant para gestionar etiquetas existentes de contactos mediante CRM o identificar planes con deuda de pagos en un rango mensual explícito, incluidos los que ya terminaron, conservando el negocio y todos los filtros al paginar."

dependencies:
  tools:
    - type: "mcp"
      value: "crm"
      description: "Servidor MCP remoto de PADMA CRM"
      transport: "streamable_http"
      url: "https://crm.derose.app/mcp"
    - type: "mcp"
      value: "money"
      description: "Servidor MCP remoto de PADMA Money"
      transport: "streamable_http"
      url: "https://money.derose.app/mcp"
