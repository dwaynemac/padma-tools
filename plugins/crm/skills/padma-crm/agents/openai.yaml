interface:
  display_name: "PADMA CRM"
  short_description: "Consultar contactos, tareas, mensajes y métricas"
  default_prompt: "Usá $padma-crm para buscar contactos autorizados y sus edades cuando sean necesarias, agregar o quitar etiquetas existentes de contactos, gestionar miembros de proyectos, colaboradores, tareas operativas —incluidas sus recurrencias— y sus conversaciones, crear o corregir actividad y elegir el análisis adecuado."

dependencies:
  tools:
    - type: "mcp"
      value: "crm"
      description: "Servidor MCP remoto de PADMA CRM"
      transport: "streamable_http"
      url: "https://crm.derose.app/mcp"
