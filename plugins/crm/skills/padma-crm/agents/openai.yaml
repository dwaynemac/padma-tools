interface:
  display_name: "PADMA CRM"
  short_description: "Consultar contactos, tareas, mensajes y métricas"
  default_prompt: "Usá $padma-crm para buscar contactos autorizados y sus edades cuando sean necesarias, inspeccionar los filtros de listas guardadas y agregar contactos mediante sus etiquetas de inclusión cuando corresponda, agregar o quitar etiquetas existentes de contactos, gestionar miembros de proyectos y sus secciones, asignar tareas operativas a varios proyectos, manejar colaboradores, recurrencias y conversaciones, crear o corregir actividad y elegir el análisis adecuado."

dependencies:
  tools:
    - type: "mcp"
      value: "crm"
      description: "Servidor MCP remoto de PADMA CRM"
      transport: "streamable_http"
      url: "https://crm.derose.app/mcp"
